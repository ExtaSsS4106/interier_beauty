{% extends "base.html" %}

{% block content %}
<div class="row g-4">

    <div class="col-12">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                    <a href="#/">
                        main
                    </a>
                    
                    <div class="row g-3">
                        <div class="col-auto">
                            <p>{{extraData.message}}</p>
                        </div>
                        <div class="col-auto">
                            <input id="inputText" type="text" class="form-control"  placeholder="text">
                        </div>
                        <div class="col-auto">
                            <button id="sendText" class="btn btn-primary mb-3">send message</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
{% endblock %}
